                                  step,
                                  step_solution.t[-1],
                                  self._experiment_padding_rest_index,
                              )

                              step_solution_with_rest = self.run_padding_rest(
                                  kwargs, rest_time, step_solution, inputs=inputs
                              )
                              step_solution += step_solution_with_rest

