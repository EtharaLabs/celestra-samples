  action: Restart each integration segment after an input-timed discontinuity from the previous segment's
    final state and state sensitivities, per input set, with a consistent re-initialisation; restart only
    the input sets that reached the segment end, give each segment the t_interp values inside it plus
    its end points, and place discontinuities next to or within one float of t_eval points without spurious
    errors.
