                      [starting_solution],
                      esoh_solver=esoh_solver,
                      save_this_cycle=True,
                      inputs=user_inputs,
                  )
                  starting_solution_cycles = [cycle_solution]
                  starting_solution_summary_variables = [cycle_sum_vars]
                  starting_solution_first_states = [cycle_first_state]
              else:
