  - id: A1
    obligation: deliverable.instruction
    dimension: craft
    weight: 1
    negate: false
    evaluation_target: test_suite_log
    criterion: Client spans keep the boto3 integration's auto.http.boto3 origin in both tracing modes
      (2 nodes).
    judgment:
      outcome_class: VALUE
      relation: all_pass
      nodes:
      - tests/integrations/boto3/test_s3.py::test_span_origin[False]
      - tests/integrations/boto3/test_s3.py::test_span_origin[True]
    evidence:
