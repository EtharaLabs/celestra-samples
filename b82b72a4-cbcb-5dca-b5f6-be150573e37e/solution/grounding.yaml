    mode: compiled
  - id: JF1
    obligation: deliverable.instruction
    dimension: coverage
    weight: 3
    negate: false
    evaluation_target: submission_diff
    criterion: Every way a boto3 client call can end (a response without a streamed body, an error raised
      after the retries, a streamed body read to the end, a streamed body closed before the end) finishes
      the call's client span, so no way of ending leaves it open.
    judgment:
      outcome_class: EFFECT
      residue: Universal over the ways a call ends and over retry outcomes; a finite test refutes instances
        but cannot decide the claim.
    evidence:
    - /logs/verifier/submission.diff, carried as the solver output in /logs/verifier/judge-request.json
    mode: judged
  - id: JF2
    obligation: deliverable.instruction
    dimension: constraints
    weight: 3
    negate: true
    evaluation_target: submission_diff
    criterion: For some way a boto3 client call can end, the change finishes the call's client span more
      than once.
    judgment:
      outcome_class: INVARIANT
      residue: Universal over the ways a call ends, including a streamed body that is read and then closed;
        a finite test refutes instances but cannot decide the claim.
    evidence:
