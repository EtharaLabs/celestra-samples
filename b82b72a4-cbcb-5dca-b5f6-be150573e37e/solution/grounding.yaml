      import itertools
      from enum import Enum
      from typing import TYPE_CHECKING

      DEFAULT_MAX_VALUE_LENGTH = None

      DEFAULT_MAX_STACK_FRAMES = 100
      DEFAULT_ADD_FULL_STACK = False

      _SENTRY_HEADER_NAMES = frozenset(("baggage", "sentry-trace"))


      # Also needs to be at the top to prevent circular import
      class EndpointType(Enum):
          """
          The type of an endpoint. This is an enum, rather than a constant, for historical reasons
          (the old /store endpoint). The enum also preserve future compatibility, in case we ever
          have a new endpoint.
          """

          ENVELOPE = "envelope"
          OTLP_TRACES = "integration/otlp/v1/traces"


      class CompressionAlgo(Enum):
          GZIP = "gzip"
          BROTLI = "br"


      if TYPE_CHECKING:
          from typing import (
              AbstractSet,
              Any,
              Callable,
              Dict,
              List,
              Optional,
              Sequence,
              Tuple,
              Type,
              Union,
          )

          from typing_extensions import Literal, TypedDict

          import sentry_sdk
          from sentry_sdk._types import (
              BreadcrumbProcessor,
              ContinuousProfilerMode,
              DataCollectionUserOptions,
              Event,
              EventProcessor,
              Hint,
              IgnoreSpansConfig,
              Log,
              Metric,
              ProfilerMode,
              SpanJSON,
              TracesSampler,
              TransactionProcessor,
          )

          # Experiments are feature flags to enable and disable certain unstable SDK
          # functionality. Changing them from the defaults (`None`) in production
          # code is highly discouraged. They are not subject to any stability
          # guarantees such as the ones from semantic versioning.
          Experiments = TypedDict(
              "Experiments",
              {
                  "max_spans": Optional[int],
                  "max_flags": Optional[int],
                  "record_sql_params": Optional[bool],
                  "continuous_profiling_auto_start": Optional[bool],
                  "continuous_profiling_mode": Optional[ContinuousProfilerMode],
                  "otel_powered_performance": Optional[bool],
                  "transport_zlib_compression_level": Optional[int],
                  "transport_compression_level": Optional[int],
                  "transport_compression_algo": Optional[CompressionAlgo],
                  "transport_num_pools": Optional[int],
                  "transport_http2": Optional[bool],
                  "transport_async": Optional[bool],
                  "enable_logs": Optional[bool],
                  "before_send_log": Optional[Callable[[Log, Hint], Optional[Log]]],
                  "enable_metrics": Optional[bool],
                  "before_send_metric": Optional[Callable[[Metric, Hint], Optional[Metric]]],
                  "trace_lifecycle": Optional[Literal["static", "stream"]],
                  "ignore_spans": Optional[IgnoreSpansConfig],
                  "before_send_span": Optional[
                      Callable[[SpanJSON, Hint], Optional[SpanJSON]]
                  ],
                  "suppress_asgi_chained_exceptions": Optional[bool],
                  "data_collection": Optional[DataCollectionUserOptions],
              },
              total=False,
          )

      DEFAULT_QUEUE_SIZE = 100
      DEFAULT_MAX_BREADCRUMBS = 100
      MATCH_ALL = r".*"

      FALSE_VALUES = [
          "false",
          "no",
          "off",
          "n",
          "0",
      ]


      class SPANTEMPLATE(str, Enum):
          DEFAULT = "default"
          AI_AGENT = "ai_agent"
          AI_TOOL = "ai_tool"
          AI_CHAT = "ai_chat"

          def __str__(self) -> str:
              return self.value


      class INSTRUMENTER:
