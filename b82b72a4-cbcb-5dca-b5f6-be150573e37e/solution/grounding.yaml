    mode: compiled
  - id: P1
    obligation: deliverable.instruction
    dimension: process
    weight: 3
    negate: true
    evaluation_target: test_suite_log
    criterion: The submitted /app/sentry-python/sentry_sdk tree carries a conftest.py, sitecustomize.py,
