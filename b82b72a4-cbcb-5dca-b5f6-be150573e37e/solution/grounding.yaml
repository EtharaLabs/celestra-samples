  - id: JS2
    obligation: deliverable.instruction
    dimension: constraints
    weight: 1
    negate: true
    evaluation_target: submission_diff
    criterion: The change starts a boto3 client span from a botocore hook that fires once per request
      attempt.
    judgment:
      outcome_class: INVARIANT
      residue: A property of where in botocore's event sequence the span starts, decidable only by reading
        which hook the change registers; no graded outcome distinguishes a hook that happens to fire once.
