rubric:
  items:
  - id: G1
    obligation: red_line.4
    dimension: outcome
    weight: 5
    negate: true
    evaluation_target: test_suite_log
    criterion: Fewer than 10% of the 29 sealed fail-to-pass nodes R1 counts (steps S1 to S4) pass against
      the submitted sentry_sdk/, or none of them passes; while either holds every item scores 0, so the
      empty submission, a submission that breaks the sentry_sdk import root, and any submission that does
      no lifecycle work score exactly 0. Above that gate G1, K1 and P1 score in proportion to the R1 share.
    judgment:
      outcome_class: ABSENCE
      relation: none_pass
      steps:
      - S1
      - S2
      - S3
      - S4
      gate:
        share: R1
        threshold: 0.1
      scale: R1
    evidence:
    - /logs/verifier/graded.json outcomes, parsed from the sealed pytest log
    mode: compiled
  - id: R1
    obligation: deliverable.instruction
    dimension: outcome
    weight: 5
    negate: false
    evaluation_target: test_suite_log
    criterion: Share of the 29 sealed fail-to-pass nodes of steps S1 to S4 that pass against the submitted
      sentry_sdk/ with boto3 and botocore 1.43.105.
    judgment:
      outcome_class: VALUE
      relation: pass_share
      steps:
      - S1
      - S2
      - S3
      - S4
    evidence:
    - /logs/verifier/graded.json outcomes, parsed from the sealed pytest log
    mode: compiled
  - id: C1
    obligation: deliverable.instruction
    dimension: coverage
    weight: 5
    negate: false
    evaluation_target: test_suite_log
    criterion: A retried client call records exactly one client span that every attempt's request carries
      under _sentrysdk_span and whose sentry-trace header names it, and an exhausted retry finishes that
      one span with an error status (6 nodes).
    judgment:
      outcome_class: EFFECT
      relation: all_pass
      steps:
      - S1
    evidence:
    - /logs/verifier/graded.json outcomes, parsed from the sealed pytest log
    mode: compiled
  - id: C2
    obligation: deliverable.instruction
    dimension: coverage
    weight: 5
    negate: false
    evaluation_target: test_suite_log
    criterion: 'A response holding a StreamingBody (the Body of get_object, the Payload of a Lambda invoke)
      keeps its client span open after the call returns until the body is consumed: read to the end through
      read(), readinto(), or readlines(), read to its content length, closed, or left as a context manager;
      it stays open while only part of the body has been read; the http.client.stream span and the stdlib
      HTTP span are its children, and the caller''s span is current again once the call returns (19 nodes).'
    judgment:
      outcome_class: ORDERING
      relation: all_pass
      steps:
      - S3
    evidence:
    - /logs/verifier/graded.json outcomes, parsed from the sealed pytest log
    mode: compiled
  - id: B1
    obligation: deliverable.instruction
    dimension: robustness
    weight: 3
    negate: false
    evaluation_target: test_suite_log
    criterion: A call whose event handler raises while the parameters are built, before any request exists,
      raises the handler's own exception object and records one client span finished with an error status
      (2 nodes).
    judgment:
      outcome_class: EFFECT
      relation: all_pass
      steps:
      - S2
    evidence:
    - /logs/verifier/graded.json outcomes, parsed from the sealed pytest log
    mode: compiled
  - id: B2
    obligation: deliverable.instruction
    dimension: robustness
    weight: 3
    negate: false
    evaluation_target: test_suite_log
    criterion: A StreamingBody whose read raises re-raises that same exception and finishes both the stream
      span and the client span once with an error status (2 nodes).
    judgment:
      outcome_class: EFFECT
      relation: all_pass
      steps:
      - S4
    evidence:
    - /logs/verifier/graded.json outcomes, parsed from the sealed pytest log
    mode: compiled
  - id: K1
    obligation: deliverable.instruction
    dimension: constraints
    weight: 5
    negate: true
    evaluation_target: test_suite_log
    criterion: At least one of the 138 pass-to-pass graded nodes of step S5 other than the two span-origin
      nodes A1 counts, the boto3 breadcrumb (one per request attempt), URL data, propagation, signing,
      and stdlib HTTP behaviour that passes at base commit 500f10e79e78, fails or errors against the submitted
      sentry_sdk/.
    judgment:
      outcome_class: INVARIANT
      relation: any_fail
      steps:
      - S5
      exclude:
      - tests/integrations/boto3/test_s3.py::test_span_origin[False]
      - tests/integrations/boto3/test_s3.py::test_span_origin[True]
      scale: R1
    evidence:
