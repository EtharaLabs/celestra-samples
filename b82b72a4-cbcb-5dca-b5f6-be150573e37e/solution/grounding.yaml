  - tests/integrations/boto3/test_s3.py::test_streaming_close[True]
- id: S4
  action: When reading a StreamingBody raises, finish the stream span and the client span once with an
    error status and re-raise the read's own exception.
  establishes: a failed body read finishes both spans
  checkers:
  - tests/integrations/boto3/test_client.py::test_streaming_body_read_failure_finishes_stream_span[False]
  - tests/integrations/boto3/test_client.py::test_streaming_body_read_failure_finishes_stream_span[True]
