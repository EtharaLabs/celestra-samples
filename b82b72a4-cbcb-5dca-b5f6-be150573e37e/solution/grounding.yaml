  workdir: /app/sentry-python
  package_src: sentry_sdk
steps:
- id: S1
  action: Start one client span per client method call that covers every retry attempt, so each request
    botocore creates for the call carries that span and names it in its sentry-trace header, and finish
    it once with an error status when the retries are exhausted.
  establishes: one client span per call across retries
  checkers:
  - tests/integrations/boto3/test_client.py::test_retries_exhausted_has_one_failed_client_span[False]
  - tests/integrations/boto3/test_client.py::test_retries_exhausted_has_one_failed_client_span[True]
  - tests/integrations/boto3/test_client.py::test_retry_attempts_share_one_client_span[False]
  - tests/integrations/boto3/test_client.py::test_retry_attempts_share_one_client_span[True]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_propagation_header_names_the_recorded_client_span[False]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_propagation_header_names_the_recorded_client_span[True]
- id: S2
  action: Open the client span before botocore builds the parameters, and when the call raises, finish
    the span with an error status and re-raise botocore's own exception object.
  establishes: a call that fails before any request exists is traced and its exception is unchanged
  checkers:
  - tests/integrations/boto3/test_client.py::test_client_call_exception_is_unchanged_and_finishes_span[False-before-parameter-build]
  - tests/integrations/boto3/test_client.py::test_client_call_exception_is_unchanged_and_finishes_span[True-before-parameter-build]
- id: S3
  action: Keep the client span open after a call returns a response holding a StreamingBody, whichever
    field holds it, active only while the call runs, and finish it after the http.client.stream child
    once the body is read to the end through read(), readinto(), or readlines(), read to its content length,
    closed, or left as a context manager, never after a partial read.
  establishes: streamed responses are traced for their whole lifetime with the caller's span restored
  checkers:
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[False-close]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[False-context]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[False-read]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[False-read_exact]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[True-close]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[True-context]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[True-read]
  - tests/integrations/boto3/test_client.py::test_streaming_span_order_and_scope[True-read_exact]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_partial_read_keeps_client_span_open[False]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_partial_read_keeps_client_span_open[True]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_readinto_to_the_end_consumes_the_body[False]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_readinto_to_the_end_consumes_the_body[True]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_readlines_consumes_the_body[False]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_readlines_consumes_the_body[True]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_streaming_payload_keeps_client_span_open[False]
  - tests/integrations/boto3/test_forge_lifecycle.py::test_streaming_payload_keeps_client_span_open[True]
  - tests/integrations/boto3/test_s3.py::test_streaming[True-False]
