schema_version = "1.4"
# score.py writes a weighted-mean score in [0, 1], not a pass/fail bit.
reward_type = "bounded_continuous"
artifacts = [
    { source = "/app/pypsa", destination = "workspace", exclude = [
        ".git",
        "__pycache__",
    ] },
]

[task]
name = "ethara/98258d6a-da32-5d91-b0cd-3d0bab26a467"
version = "1.0.0"
description = "Make PyPSA's multi-period optimisation work under linopy's v1 arithmetic semantics, which forbid a MultiIndex dimension coordinate, by building models over a flat snapshot dimension through the model builders, expressions, statistics, and transport delays."
authors = [{ name = "mumukshu.panchal", email = "mumukshu.panchal@ethara.ai" }]
keywords = [
    "pypsa",
    "linopy",
    "optimization",
    "energy-systems",
    "depmigrate",
    "python",
]

[metadata]
null_floor = 0.0
discrimination_weight = 0.5
platforms = ["linux/amd64", "linux/arm64"]

[verifier]
timeout_sec = 3600
network_mode = "no-network"
environment_mode = "separate"
# test.sh starts as root only to make the submission readable, then grades as uid 10001.
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
storage_mb = 10240
gpus = 0

[agent]
timeout_sec = 18000
network_mode = "no-network"
user = "10001"

[environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0

[upstream_provenance]
origin = "original"
provenance_date = "2026-07-21"
source_kind = "public_repository"

[upstream_provenance.source]
canonical_repo = "https://github.com/PyPSA/PyPSA"
fork_ancestry_digest = "sha256:484d26cbda7ad03f699710fb177b1f1dd0b7fda90626d42912e916c2c61e9098"
base_commit = "6d1da8049b3346969bc8f2b97f7835dc0b7c6fbe"
event_timestamp = "2026-07-21T08:57:16Z"
