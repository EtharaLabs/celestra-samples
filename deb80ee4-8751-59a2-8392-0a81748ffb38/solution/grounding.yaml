    reference_diff_sha256: 9c57259cd57543a856c76eaf8d89bbf2c02d1adce5ac01a3b70dd84d5f5fd8fe
    reference_diff: "--- /dev/null\n+++ b/pypsa/_linopy_compat.py\n@@ -0,0 +1,87 @@\n+# SPDX-FileCopyrightText:\
      \ PyPSA Contributors\n+#\n+# SPDX-License-Identifier: MIT\n+\n+\"\"\"Version probes for linopy's\
      \ v1 arithmetic semantics.\n+\n+linopy's v1 semantics forbid a `pd.MultiIndex` as a dimension coordinate.\
      \ Under\n+v1, PyPSA therefore builds multi-period models over a flat `snapshot` dim (see\n+`pypsa.optimization.window`).\
      \ This module detects what the installed linopy\n+supports and resolves the snapshot representation\
      \ against it; delete it once v1\n+is linopy's default and PyPSA requires that release.\n+\"\"\"\n\
      +\n+from __future__ import annotations\n+\n+import inspect\n+import warnings\n+from contextlib import\
      \ contextmanager\n+from typing import TYPE_CHECKING\n+\n+import pandas as pd\n+from linopy import\
      \ Model\n+from linopy import options as linopy_options\n+\n+if TYPE_CHECKING:\n+    from collections.abc\
      \ import Iterator\n+\n+try:\n+    from linopy.config import LinopySemanticsWarning\n+except ImportError:\
      \  # linopy without the v1 semantics option\n+    LinopySemanticsWarning = None\n+\n+# Ragged piecewise\
      \ curves are stored densely. Only linopy with v1 semantics lets\n+# the absent slots be declared.\
      \ Older releases infer them from NaN padding.\n+SUPPORTS_BREAKPOINT_MASK = (\n+    \"mask\" in inspect.signature(Model.add_piecewise_formulation).parameters\n\
      +)\n+\n+\n+def linopy_uses_v1() -> bool:\n+    \"\"\"Whether linopy's v1 arithmetic semantics are\
      \ active.\"\"\"\n+    try:\n+        return linopy_options[\"semantics\"] == \"v1\"\n+    except\
      \ KeyError:\n+        return False\n+\n+\n+def use_flat_snapshot_index(sns: pd.Index, option: str)\
      \ -> bool:\n+    \"\"\"Whether a model built over `sns` labels `snapshot` with flat tuples.\n+\n\
      +    Resolves the `pypsa.options.optimization.model_snapshot_index` option\n+    against linopy's\
      \ active semantics.\n+    \"\"\"\n+    if option not in (\"auto\", \"flat\", \"multiindex\"):\n\
      +        msg = (\n+            f\"Invalid snapshot representation '{option}'. Choose 'auto', \"\n\
      +            \"'flat' or 'multiindex'.\"\n+        )\n+        raise ValueError(msg)\n+    if not\
      \ isinstance(sns, pd.MultiIndex):\n+        return False\n+    if option == \"auto\":\n+       \
      \ return linopy_uses_v1()\n+    if option == \"multiindex\" and linopy_uses_v1():\n+        msg\
      \ = (\n+            \"linopy's v1 semantics forbids a MultiIndex snapshot dimension. \"\n+     \
      \       \"Build with pypsa.options.optimization.model_snapshot_index \"\n+            \"= 'flat'\
      \ (or 'auto') instead.\"\n+        )\n+        raise ValueError(msg)\n+    return option == \"flat\"\
      \n+\n+\n+@contextmanager\n+def suppress_semantics_warnings() -> Iterator[None]:\n+    \"\"\"Silence\
      \ linopy's legacy-to-v1 divergence notices for the wrapped block.\n+\n+    PyPSA builds identical\
      \ models under both semantics, but on legacy linopy the\n+    build trips a deprecation notice per\
      \ operation. A no-op under v1 and on\n+    linopy without the semantics option.\n+    \"\"\"\n+\
      \    if LinopySemanticsWarning is None or linopy_uses_v1():\n+        yield\n+        return\n+\
      \    with warnings.catch_warnings():\n+        warnings.filterwarnings(\"ignore\", category=LinopySemanticsWarning)\n\
      +        yield\n--- a/pypsa/_options.py\n+++ b/pypsa/_options.py\n@@ -485,6 +485,16 @@\n     \"\
      Values within this tolerance of the boundary are not flagged as inconsistent. \"\n     \"Set to\
      \ 0 to disable tolerance and flag any violation.\",\n )\n+# Optimization category\n+options._add_option(\n\
      +    \"optimization.model_snapshot_index\",\n+    \"auto\",\n+    \"Snapshot dimension of multi-period\
      \ models: 'multiindex' keeps the \"\n+    \"(period, timestep) MultiIndex, 'flat' uses tuple labels\
      \ \"\n+    \"with period/timestep auxiliary coordinates, 'auto' picks by linopy's active \"\n+ \
      \   \"semantics ('flat' under v1, else 'multiindex'). Applies to newly built \"\n+    \"models only.\"\
      ,\n+)\n # Warnings category\n options._add_option(\n     \"warnings.components_store_iter\",\n---\
      \ a/pypsa/components/_types/mixin/multiports.py\n+++ b/pypsa/components/_types/mixin/multiports.py\n\
      @@ -135,9 +135,10 @@\n     @staticmethod\n     def get_delay_source_indexer(\n         snapshots:\
      \ pd.Index,\n-        weightings: pd.Series,\n+        weightings: pd.Series | np.ndarray,\n   \
      \      delay: int,\n         is_cyclic: bool,\n+        periods: np.ndarray | None = None,\n   \
      \  ) -> tuple[np.ndarray, np.ndarray]:\n         \"\"\"Get per-snapshot source positions for component\
      \ delays.\n \n@@ -147,22 +148,26 @@\n         starts. In cyclic mode, source times wrap around the\
      \ horizon. In\n         non-cyclic mode, targets without a valid source are marked invalid.\n \n\
