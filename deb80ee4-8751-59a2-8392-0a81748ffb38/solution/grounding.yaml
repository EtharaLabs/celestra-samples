rejected_routes:
- control: global-roll
  route: Roll cyclic storage and store states over the whole flat snapshot dimension, so the last snapshot
    of one investment period feeds the first of the next.
  rejected_by:
  - test/test_lopf_multiinvest.py::test_simple_network_storage_cyclic_per_period
  - test/test_lopf_multiinvest.py::test_simple_network_storage_noncyclic_per_period
  - test/test_lopf_multiinvest.py::test_simple_network_store_cyclic_per_period
  - test/test_lopf_multiinvest.py::test_simple_network_store_noncyclic_per_period
- control: unweighted-periods
  route: Flatten the snapshots but drop the investment-period weighting, so per-period energy limits and
    the objective weigh every period alike.
  rejected_by:
  - test/test_lopf_multiinvest.py::test_storage_unit_primary_energy_and_operational_limit_constraint_with_per_period
  - test/test_lopf_multiinvest.py::test_store_primary_energy_and_operational_limit_constraint_with_per_period
