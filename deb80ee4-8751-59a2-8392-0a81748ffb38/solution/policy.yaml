vocabulary: 'Trinity capability vocabulary version 2: read, write, execute, network, environment, timing,
  ipc, resource, context. Intent only; enforcement is attested by the runner, never by this block.'
channels:
  read: restricted
  write: restricted
  execute: allowed
  network: denied
  environment: restricted
  timing: restricted
  ipc: denied
  resource: restricted
  context: restricted
notes:
  read: the agent reads instruction.md and its own workspace; tests/, solution/, and the reference commit
    are absent from its image
  write: the agent, as uid 10001, writes only its workspace; only the declared artifact reaches the verifier
  execute: the agent runs arbitrary code inside its container
  network: no-network baseline for agent and verifier
  environment: no credential or host variable reaches the trial; the runner strips env and user bindings
  timing: agent and verifier run under the task.toml timeouts
  ipc: the agent and the separate verifier share no process, socket, or filesystem beyond the declared
    artifact
  resource: cpus, memory_mb, storage_mb, and gpus zero as each task.toml binds
  context: the agent receives instruction.md and the workspace and nothing about grading
